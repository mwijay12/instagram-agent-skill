const S = window.STRATEGY;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COPY = [];
const copyBtn = (text, label="nakili") => {
  const i = COPY.push(text) - 1;
  return `<button class="btn" data-copy="${i}">${label}</button>`;
};

/* hero */
$("#hero-kicker").textContent = S.meta.company + "  /  " + S.meta.edition;
$("#hero-title").innerHTML = esc(S.meta.title).replace(/ /g," ") +
  "<br><em>" + esc(S.meta.subtitle) + "</em>";
$("#hero-lede").textContent = S.meta.status + "  ·  " + S.meta.prepared_for;
$("#badges").innerHTML = [
  S.meta.place, S.meta.accounts, "4 bio variations", "47 pass / 0 fail / READY",
  "PDF + Google Doc + Vercel"
].map((b,i)=>`<span class="badge ${i===3?'g':''}">${esc(b)}</span>`).join("");
const L = S.links || {};
$("#links").innerHTML =
  (L.pdf ? `<a href="${esc(L.pdf)}" target="_blank" rel="noopener">Fungua PDF</a>` : "") +
  (L.doc ? `<a href="${esc(L.doc)}" target="_blank" rel="noopener">Google Doc</a>` : "") +
  `<a class="ghost" href="https://github.com/mwijay12/instagram-agent-skill" target="_blank" rel="noopener">Repo</a>` +
  `<a class="ghost" href="#s03">Chagua bio</a>`;

/* nav */
$("#nav").innerHTML = S.sections.map(s =>
  `<a href="#s${esc(s.id)}">${esc(s.id)} · ${esc(s.title)}</a>`).join("");

function table(b){
  return `<table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
    b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("") +
    `</tbody></table>`;
}
function variations(){
  return S.bio.variations.map((v,i)=>`
    <div class="var ${v.recommended?'pick':''}">
      <div class="row"><h3>V${i+1} · ${esc(v.label)}</h3>${copyBtn(v.name+"\n\n"+v.bio,"nakili zote mbili")}</div>
      ${v.recommended?'<span class="pick-tag">INAYOSUGGEST</span>':''}
      <div class="lbl">Name field · ${v.name_chars}/30</div><pre>${esc(v.name)}</pre>
      <div class="lbl">Bio · ${v.bio_chars}/150</div><pre>${esc(v.bio)}</pre>
      <div class="note"><b>Kwa nini:</b> ${esc(v.why)}<br><b>Gharama:</b> ${esc(v.tradeoff)}</div>
    </div>`).join("") +
    `<p style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">
      Chanzo: bio-variations.json · default ya sasa ni V2 · mmiliki bado hajachagua</p>`;
}
function contacts(){
  const c=S.bio.contacts, d=S.bio.domain;
  const rows=[
    ["Email",c.email,"Contact button (Email) kwenye profile"],
    ["WhatsApp BOT",c.whatsapp_bot.local+" / "+c.whatsapp_bot.intl,c.whatsapp_bot.use],
    ["MTU halisi",c.human.intl,c.human.use],
    ["Link",d.current,d.status]
  ];
  return table({head:["Kitu","Thamani","Mahali / maana"],rows}) +
    `<p><b>Bot si mtu:</b> usiiweke kama Call button. Wao wanaanza, wewe unajibu - hakuna bulk DM.</p>`;
}
function captions(){
  return S.bio.caption_examples.map((c,i)=>`
    <div class="cap"><div class="t">CAPTION ${i+1}</div><b>${esc(c.line1)}</b>
    <p>${esc(c.body)}</p><code>${esc(c.ask)}</code>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">
      &nbsp; ${esc(c.hashtags.join(" "))}</span></div>`).join("");
}
function block(b){
  switch(b.type){
    case "p": return `<p>${esc(b.text)}</p>`;
    case "bullets": return `<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    case "table": return table(b);
    case "callout": return `<div class="callout"><b>${esc(b.label)}</b><p>${esc(b.text)}</p></div>`;
    case "variations": return variations();
    case "contacts": return contacts();
    case "captions": return captions();
    default: return "";
  }
}
$("#sections").innerHTML = S.sections.map(s=>`
  <section class="card" id="s${esc(s.id)}">
    <div class="kicker">${esc(s.kicker)}</div>
    <h2>${esc(s.id)} · ${esc(s.title)}</h2>
    <div class="rule"></div>
    ${s.blocks.map(block).join("")}
  </section>`).join("");

$("#footer").innerHTML = `ALTRAWARE TECH · ${esc(S.meta.edition)}<br>` +
  `Chanzo: content-kit/present/content.json + content-kit/bio-variations.json<br>` +
  `Hakuna kilichopostwa kwenye Instagram · hakuna DM · hakuna credentials kwenye tovuti hii.`;

document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if(!b) return;
  navigator.clipboard.writeText(COPY[+b.dataset.copy]).then(()=>{
    const t=$("#toast"); t.classList.add("on");
    setTimeout(()=>t.classList.remove("on"),1500);
  });
});
</script>
