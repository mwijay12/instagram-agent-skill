<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timecut engine trial</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#071022;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function size() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  size();
  window.addEventListener('resize', size);
  var start = null;
  function draw(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    var w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#071022';
    ctx.fillRect(0, 0, w, h);
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, 'rgba(124,58,237,.30)');
    g.addColorStop(1, 'rgba(234,179,8,.16)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 12; i++) {
      var x = (w * 0.12) + (i * w * 0.075) + Math.sin(t * 1.7 + i) * 22;
      var y = h * 0.30 + Math.sin(t * 1.2 + i * 0.55) * 90;
      ctx.beginPath();
      ctx.arc(x, y, 3 + (i % 4), 0, Math.PI * 2);
      ctx.fillStyle = i % 3 === 0 ? '#eab308' : '#7c3aed';
      ctx.fill();
    }
    var bar = Math.min(1, t / 1.4);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(w * 0.12, h * 0.60, w * 0.76 * bar, 12);
    ctx.font = '700 46px Arial, Helvetica, sans-serif';
    ctx.fillStyle = '#f7f6f2';
    ctx.fillText('TIMECUT OK', w * 0.12, h * 0.50);
    ctx.font = '500 22px monospace';
    ctx.fillStyle = '#a3aecb';
    ctx.fillText('CHROMIUM 153 · JS CANVAS → MP4', w * 0.12, h * 0.56);
    ctx.fillText('t = ' + t.toFixed(2) + 's', w * 0.12, h * 0.70);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
